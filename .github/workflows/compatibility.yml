# Does this CLI still install the latest Firetower?
#
# The CLI fetches deploy/firetower.yml from the main repository at install
# time, so a change there lands here without a commit. That is the right
# design — the compose file always matches the images — but it means upstream
# can break this CLI while every test in it still passes.
#
# So: install the real thing, on a schedule, and open an issue when it stops
# working. Nightly rather than on-release, deliberately — a cross-repo trigger
# is one more credential to keep alive, and "found within a day" is enough for
# a failure nobody is waiting on.
name: compatibility

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  install-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Installing the latest Firetower release fails"
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "compatibility",
            })

            // One issue, reopened by comments, rather than one a night.
            if (open.some((issue) => issue.title === title)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.find((issue) => issue.title === title).number,
                body: `Still failing: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              })
              return
            }

            await github.rest.issues.create({
              ...context.repo,
              title,
              labels: ["compatibility"],
              body: `The nightly install against the latest Firetower release failed.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
