# Version, tag, publish.
#
# release-please accumulates what lands on main into one open pull request —
# "chore(main): release 0.2.0" — carrying the version bump and the changelog
# entry it worked out from the commit messages. Nothing is released until
# somebody merges it, so the decision to cut a version stays a review rather
# than a side effect of merging a feature.
#
# Merging it tags, and the tag gates the publish below. A merge that is not
# that pull request does nothing here.
#
# The version is this CLI's own, not Firetower's. They were tied together while
# the CLI pinned image tags; it uses `:latest`, so a CLI release means the CLI
# changed and nothing else. `bump-minor-pre-major` keeps a breaking change on
# the minor while this is below 1.0.
#
# Unlike the main repository there is no lockfile to refresh: pnpm-lock.yaml
# records dependency versions, never the root package's own, so nothing goes
# out of step with the bump. Cargo.lock does, which is what release-lockfile.yml
# is for over there.
#
# Publishing needs an NPM_TOKEN secret — a granular automation token, scoped to
# publish @firetower/cli and nothing else.
#
# It can be removed later. npm trusted publishing signs over OIDC with no stored
# credential at all, and this job already requests the `id-token: write` it
# needs. The catch is that a trusted publisher is configured on the package's
# own settings page, which does not exist until the package has been published
# once — so the token is how a package gets off the ground, not how it stays
# there.
#
# To switch, once 0.1.0 is on the registry:
#
#   1. npmjs.com → @firetower/cli → Settings → Trusted publisher
#      → this repository, workflow `release.yml`
#   2. delete the NODE_AUTH_TOKEN line below
#   3. delete the NPM_TOKEN secret
#
# `--provenance` works either way: it wants `id-token: write`, not OIDC auth.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: please
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.please.outputs.tag }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # setup-node above writes an .npmrc pointing at NODE_AUTH_TOKEN. Setting
      # the secret is not enough on its own — without this line npm reads an
      # empty token and the publish fails as unauthenticated.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
