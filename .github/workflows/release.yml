# Version, tag, publish.
#
# release-please accumulates what lands on main into one open pull request —
# "chore(main): release 0.2.0" — carrying the version bump and the changelog
# entry it worked out from the commit messages. Nothing is released until
# somebody merges it, so the decision to cut a version stays a review rather
# than a side effect of merging a feature.
#
# Merging it tags, and the tag gates the publish below. A merge that is not
# that pull request does nothing here.
#
# The version is this CLI's own, not Firetower's. They were tied together while
# the CLI pinned image tags; it uses `:latest`, so a CLI release means the CLI
# changed and nothing else. `bump-minor-pre-major` keeps a breaking change on
# the minor while this is below 1.0.
#
# Unlike the main repository there is no lockfile to refresh: pnpm-lock.yaml
# records dependency versions, never the root package's own, so nothing goes
# out of step with the bump. Cargo.lock does, which is what release-lockfile.yml
# is for over there.
#
# Publishing is over OIDC — npm trusted publishing — so there is no token in
# this repository to rotate or leak. Register this file at
# npmjs.com → @firetower/cli → Settings → Trusted publisher.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: please
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.please.outputs.tag }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public
